# backend/src/main/resources/application.yaml
spring:
  config:
    import: optional:file:../.env[.properties] # legge le variabili d'ambiente dal file .env se esiste, altrimenti ignora
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5433/piwatch
    username: ${USER_DB:piwatch}
    password: ${PASS_DB:piwatch}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080