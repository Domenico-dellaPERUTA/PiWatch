services:
  # --- DATABASE ---
  postgres:
    image: postgres:15-alpine
    container_name: piwatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: piwatch
      POSTGRES_USER: ${USER_DB:-piwatch_user}       # Usa variabile d'ambiente o default
      POSTGRES_PASSWORD: ${PASS_DB:-piwatch_password}
    ports:
      - "5433:5432" # Mappata su 5433 per evitare conflitti con DB locali del Mac
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - piwatch-network

  # --- BACKEND JAVA ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: piwatch-backend
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/piwatch
      SPRING_DATASOURCE_USERNAME: ${USER_DB:-piwatch_user}
      SPRING_DATASOURCE_PASSWORD: ${PASS_DB:-piwatch_password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update # Crea/aggiorna le tabelle automaticamente
    networks:
      - piwatch-network

  # --- AGENT PYTHON ---
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: piwatch-agent
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8080 # Comunica con il servizio 'backend', non localhost
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/log:/var/log:ro
    networks:
      - piwatch-network

volumes:
  postgres_data:

networks:
  piwatch-network:
    driver: bridge